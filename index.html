<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini JPL Tournament – जोताई</title>
<style>
:root{--bg:#0b1d3a;--card:#13294f;--gold:#f5b700;--text:#f2f5fa;--mut:#9fb0cc;--ok:#22c55e;--bad:#ef4444;--line:#2c4777;--or:#ff7a00;--pu:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0b1d3a,#1d3f7a);padding:12px 14px;text-align:center;border-bottom:3px solid var(--gold);position:relative}
header h1{margin:0;font-size:24px;color:var(--gold)}
header p{margin:3px 0 0;color:var(--mut);font-size:14px}
#startBar{margin-top:4px;font-size:15px;font-weight:600}
.hdrBtns{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.langBtn{background:linear-gradient(135deg,#f5b700,#ffdf6b);color:#111;border:0;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.hbtn{background:#fff;color:#222;border:0;padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#0a1830;position:sticky;top:0;z-index:5;scrollbar-width:thin}
nav button{flex:none;white-space:nowrap;background:var(--card);color:var(--text);border:0;padding:9px 13px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--gold);color:#000;font-weight:700}
nav .langBtn{padding:9px 13px;border-radius:8px}
main{max-width:1000px;margin:0 auto;padding:14px}
section{display:none}section.on{display:block}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
h2,h3{margin-top:0}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0d2145;color:var(--text);font-size:16px}
input[type=checkbox]{width:auto}
button.pri{background:var(--gold);color:#000;border:0;padding:12px;border-radius:8px;font-size:16px;font-weight:700;width:100%;margin-top:12px;cursor:pointer}
button.sm{background:var(--line);color:#fff;border:0;padding:7px 11px;border-radius:6px;cursor:pointer;margin:2px;font-size:13px}
button.ok{background:var(--ok);color:#000;font-weight:700}
button.bad{background:var(--bad);color:#fff;font-weight:700}
button.wa{background:#25d366;color:#000;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--gold)}
.tw{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pc{background:#0d2145;border-radius:12px;padding:12px;text-align:center;cursor:pointer;border:1px solid var(--line)}
.pc img.pp{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
img.th{width:42px;height:42px;object-fit:cover;border-radius:6px;cursor:pointer}
.lg{border-radius:50%;object-fit:cover;vertical-align:middle;background:#0d2145}
.lg.ph{display:inline-flex;align-items:center;justify-content:center}
.tag{padding:3px 9px;border-radius:12px;font-size:12px;display:inline-block;margin:2px}
.paid{background:var(--ok);color:#000}.pend{background:#f59e0b;color:#000}.rej{background:var(--bad)}
.role{background:var(--gold);color:#000}
.livebadge{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.center{text-align:center}
.msg{padding:9px;border-radius:8px;margin-top:8px;background:#0d2145}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.row,.row3{grid-template-columns:1fr}}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btns button{min-width:46px;padding:12px 8px;font-size:17px;font-weight:700;background:var(--line);color:#fff;border:0;border-radius:8px;cursor:pointer}
.btns button.sel{background:var(--gold);color:#000}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:560px;width:100%;margin:auto}
.modal img.big{max-width:100%;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:#0d2145;border-radius:8px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--gold)}
.stats small{color:var(--mut)}
.score{font-size:30px;font-weight:800;color:var(--gold)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:17px;background:var(--line);margin:2px;font-weight:700;padding:0 6px}
.chip.r4{background:#16a34a}.chip.r6{background:var(--pu)}.chip.w{background:var(--bad)}.chip.x{background:#b45309}
.bar{height:10px;background:#0d2145;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff7a00)}
.capbox{background:#0d2145;border-radius:10px;padding:10px}
.cap-or{border-top:4px solid var(--or)}.cap-pu{border-top:4px solid var(--pu)}
.hero{background:radial-gradient(circle at top,#1d3f7a,#0b1d3a);text-align:center;padding:22px 14px}
.hero h2{color:var(--gold);font-size:26px;margin-bottom:6px}
/* marquees */
.mq{overflow:hidden;white-space:nowrap}
.mq>div{display:inline-flex;gap:36px;animation:mq 40s linear infinite;will-change:transform}
.mq:hover>div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.tick{background:#7f1d1d;color:#fff;padding:7px 0;font-size:14px;font-weight:600}
.mq.sp{background:#fff;border-radius:10px;padding:8px 0;margin-bottom:14px}
.mq.sp>div{gap:46px;animation-duration:30s}
.spn{display:inline-flex;align-items:center;gap:8px;color:#111}
.spn img{height:46px;max-width:120px;object-fit:contain}
.spn.ttl img{height:62px}
.spn small{font-weight:700}.spn em{font-size:11px;background:var(--gold);padding:2px 6px;border-radius:8px;font-style:normal}
/* auction arena */
.arena{position:relative;background:radial-gradient(ellipse at top,#1a2c5e 0%,#050a1c 70%);border:2px solid var(--gold);border-radius:16px;padding:18px;text-align:center;min-height:520px;overflow:hidden;display:flex;flex-direction:column}
.arena:fullscreen{border-radius:0;min-height:100vh}
.arena-top{display:flex;justify-content:space-between;align-items:center}
.arena .photo{width:230px;height:230px;border-radius:50%;object-fit:cover;border:6px solid var(--gold);box-shadow:0 0 40px #f5b70066}
.arena .nm{font-size:44px;font-weight:900;color:var(--gold);line-height:1.1;margin-top:8px}
.arena .bid{font-size:78px;font-weight:900;color:#fff;text-shadow:0 0 25px #f5b700aa;line-height:1}
.arena .lbl{color:var(--mut);font-size:18px}
.arena-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 0}
.arena .tick{background:#0a1228;border-top:2px solid var(--gold);margin:12px -18px -18px;padding:10px 0;font-size:16px}
.arena .tick span{display:inline-flex;align-items:center;gap:8px}
.stamp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,28,.82);z-index:5;animation:fadeIn .3s}
.stamp b{font-size:110px;letter-spacing:6px;border:10px solid;padding:0 30px;border-radius:14px;transform:rotate(-8deg);animation:slam .6s cubic-bezier(.2,2,.4,1)}
.stamp.sold b{color:var(--ok);border-color:var(--ok)}
.stamp.unsold b{color:var(--bad);border-color:var(--bad)}
.stamp .tm{font-size:34px;font-weight:800;margin-top:18px;display:flex;align-items:center;gap:12px}
.stamp .pr{font-size:54px;color:var(--gold);font-weight:900}
@keyframes slam{0%{transform:scale(4) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes fadeIn{from{opacity:0}}
@media(max-width:600px){.arena .nm{font-size:30px}.arena .bid{font-size:52px}.arena .photo{width:150px;height:150px}.stamp b{font-size:64px}}
@media print{header,nav,.noprint,.tick{display:none!important}body{background:#fff;color:#000}th,td{color:#000}}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="pubRoot">

<header>
  <h1>🏏 Mini JPL Tournament</h1>
  <p data-t="📍 जोताई, पोरसा, मुरैना (म.प्र.)|📍 Jotai, Porsa, Morena (M.P.)"></p>
  <div id="startBar"></div>
  <div class="hdrBtns"><button class="langBtn"></button><button class="hbtn" id="authBtn"></button></div>
</header>
<div id="topTicker"></div>
<nav>
  <button class="langBtn"></button>
  <button class="on" data-tab="home" data-t="होम|Home"></button>
  <button data-tab="reg" data-t="रजिस्ट्रेशन|Register"></button>
  <button data-tab="players" data-t="खिलाड़ी|Players"></button>
  <button data-tab="teams" data-t="टीमें|Teams"></button>
  <button data-tab="live" data-t="लाइव स्कोर|Live Score"></button>
  <button data-tab="auction" data-t="लाइव ऑक्शन|Live Auction"></button>
  <button data-tab="myteam" id="myTeamBtn" class="hidden" data-t="मेरी टीम|My Team"></button>
  <button data-tab="sched" data-t="शेड्यूल|Schedule"></button>
  <button data-tab="points" data-t="पॉइंट्स व रैंकिंग|Points & Rankings"></button>
  <button data-tab="fan" data-t="फैन ज़ोन|Fan Zone"></button>
  <button data-tab="gallery" data-t="गैलरी|Gallery"></button>
  <button data-tab="poster" data-t="पोस्टर|Poster"></button>
  <button data-tab="coach" data-t="कोच|Coaches"></button>
</nav>
<main>

<section id="home" class="on">
  <div class="card hero"><h2 data-t="मिनी JPL टूर्नामेंट में आपका स्वागत है|Welcome to Mini JPL Tournament"></h2><div id="heroInfo"></div></div>
  <div class="card"><h3 data-t="🔴 लाइव / अगला मैच|🔴 Live / Next Match"></h3><div id="homeMatch"></div></div>
  <div id="homeSp"></div>
  <div class="card"><h3 data-t="🎯 फैन ज़ोन|🎯 Fan Zone"></h3><div class="fz"></div></div>
  <div class="card stats" id="homeStats"></div>
</section>

<section id="reg">
  <div class="card" id="regCard">
    <h2 data-t="खिलाड़ी रजिस्ट्रेशन|Player Registration"></h2>
    <form id="regForm">
      <label data-t="खिलाड़ी का नाम *|Player Name *"></label><input id="name" required>
      <div class="row">
        <div><label data-t="उम्र *|Age *"></label><input id="age" type="number" min="5" max="70" required></div>
        <div><label data-t="गाँव *|Village *"></label><input id="village" required></div>
      </div>
      <div class="row">
        <div><label data-t="मोबाइल नंबर *|Mobile Number *"></label><input id="mobile" type="tel" pattern="[0-9]{10}" maxlength="10" required></div>
        <div><label data-t="रोल *|Role *"></label>
          <select id="role"><option value="bat" data-t="बल्लेबाज|Batter"></option><option value="bowl" data-t="गेंदबाज|Bowler"></option><option value="all" data-t="ऑलराउंडर|All-rounder"></option></select></div>
      </div>
      <label data-t="टी-शर्ट साइज़ *|T-Shirt Size *"></label>
      <select id="tsize"><option>S</option><option>M</option><option selected>L</option><option>XL</option><option>XXL</option></select>
      <label data-t="पासपोर्ट फोटो *|Passport Photo *"></label><input id="photo" type="file" accept="image/*" required>
      <div class="msg center" id="payBox"></div>
      <label data-t="पेमेंट का स्क्रीनशॉट *|Payment Screenshot *"></label><input id="shot" type="file" accept="image/*" required>
      <button class="pri" id="regBtn" data-t="रजिस्टर करें|Register"></button>
    </form>
    <div id="regMsg"></div>
  </div>
  <div class="card center hidden" id="doneCard">
    <h2 data-t="✅ रजिस्ट्रेशन हो गया!|✅ Registration Submitted!"></h2>
    <p style="color:var(--mut)" data-t="एडमिन पेमेंट वेरिफाई करके आपको ऑक्शन में जोड़ देंगे।|Admin will verify your payment and add you to the auction pool."></p>
    <canvas id="cardCanvas" style="max-width:100%;width:380px;border-radius:12px"></canvas>
    <div class="row"><button class="pri" id="dlCard" data-t="⬇️ PNG डाउनलोड|⬇️ Download PNG"></button><button class="pri wa" id="shCard" data-t="WhatsApp पर शेयर करें|Share on WhatsApp"></button></div>
    <a id="waAdmin" target="_blank"><button class="pri" data-t="एडमिन को WhatsApp सूचना|Notify Admin on WhatsApp"></button></a>
    <button class="pri" id="newReg" data-t="➕ नया रजिस्ट्रेशन (किसी और का)|➕ New Registration (someone else)"></button>
  </div>
</section>

<section id="players">
  <div class="card"><h2 data-t="सभी खिलाड़ी|All Players"></h2>
    <div class="row">
      <div><label data-t="टीम|Team"></label><select id="fTeam"></select></div>
      <div><label data-t="रोल|Role"></label><select id="fRole"><option value="" data-t="सभी|All"></option><option value="bat" data-t="बल्लेबाज|Batter"></option><option value="bowl" data-t="गेंदबाज|Bowler"></option><option value="all" data-t="ऑलराउंडर|All-rounder"></option></select></div>
    </div></div>
  <div class="grid" id="pGrid"></div>
</section>

<section id="teams"><div id="teamGrid" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"></div></section>

<section id="live">
  <div class="card"><label data-t="मैच चुनें|Select Match"></label><select id="liveMatch"></select><div id="liveBoard" style="margin-top:12px"></div></div>
  <div class="card"><h3 data-t="🕒 हाल की गेंदें|🕒 Recent Balls"></h3><div id="recent"></div></div>
  <div class="card"><h3 data-t="🎙️ लाइव कमेंट्री|🎙️ Live Commentary"></h3><div id="commentary"></div></div>
  <div class="card"><h3 data-t="🎯 फैन ज़ोन|🎯 Fan Zone"></h3><div class="fz"></div></div>
</section>

<section id="auction">
  <div class="arena" id="arena">
    <div class="arena-top"><span id="aucBadge" class="tag"></span><span><button class="sm" id="soundBtn">🔊</button><button class="sm" id="fsBtn">⛶</button></span></div>
    <div class="arena-stage" id="aucStage"></div>
    <div id="stampBox"></div>
    <div id="aucTicker"></div>
  </div>
  <div id="aucSp" style="margin-top:14px"></div>
</section>

<section id="myteam"><div class="card" id="myTeamBox"></div></section>

<section id="sched"><div class="card"><h2 data-t="मैच शेड्यूल|Match Schedule"></h2><div class="tw"><table id="matchTbl"></table></div></div></section>

<section id="points">
  <div class="card"><h2 data-t="पॉइंट्स टेबल|Points Table"></h2><div class="tw"><table id="ptsTbl"></table></div></div>
  <div class="card"><h3 data-t="लीडरबोर्ड|Leaderboards"></h3><div id="caps" class="row"></div></div>
  <div class="card"><h3 data-t="🏅 प्लेयर रैंकिंग|🏅 Player Ranking"></h3><div class="tw"><table id="rankTbl"></table></div><small style="color:var(--mut)" data-t="पॉइंट्स = रन + विकेट×25 + (कैच/स्टंप/रन आउट)×10 + चौके + छक्के×2|Points = runs + wickets×25 + (catch/stumping/run-out)×10 + fours + sixes×2"></small></div>
</section>

<section id="fan"><div class="card"><h2 data-t="🎯 फैन ज़ोन – वोट करें|🎯 Fan Zone – Vote Now"></h2><div class="fz"></div></div></section>

<section id="gallery">
  <div class="card">
    <h3 data-t="फोटो अपलोड करें|Upload Photo"></h3>
    <div class="row"><div><label data-t="कैप्शन|Caption"></label><input id="gCap"></div><div><label data-t="फोटो|Photo"></label><input id="gFile" type="file" accept="image/*"></div></div>
    <button class="pri" id="gUp" data-t="अपलोड करें|Upload"></button>
    <label data-t="या वीडियो/रील का लिंक|Or a video/reel link"></label>
    <div class="row"><input id="gLink" placeholder="https://..."><button class="sm" id="gLinkAdd" data-t="लिंक जोड़ें|Add Link"></button></div>
    <p style="color:var(--mut);font-size:13px" data-t="अपलोड एडमिन की मंज़ूरी के बाद दिखेगा।|Uploads appear after admin approval."></p>
    <div id="gMsg"></div>
  </div>
  <div class="grid" id="gGrid"></div>
</section>

<section id="poster">
  <div class="card">
    <h3 data-t="मैच पोस्टर|Match Poster"></h3>
    <label data-t="मैच चुनें|Select Match"></label><select id="posterMatch"></select>
    <button class="pri" id="posterGen" data-t="पोस्टर बनाएं|Generate Poster"></button>
    <div class="center" style="margin-top:12px"><canvas id="posterCanvas" style="max-width:100%;width:420px;border-radius:12px"></canvas></div>
    <div class="row hidden" id="posterBtns"><button class="pri" id="posterDl" data-t="⬇️ डाउनलोड|⬇️ Download"></button><button class="pri wa" id="posterWa" data-t="WhatsApp पर शेयर|Share on WhatsApp"></button></div>
  </div>
</section>

<section id="coach"><div class="card"><h2 data-t="कोच|Coaches"></h2><div id="coachList"></div></div></section>
</main>

<footer class="center" style="padding:18px;color:var(--mut);font-size:13px">Mini JPL • Jotai, Porsa, Morena (M.P.) • <a href="#admin" data-t="🔒 एडमिन|🔒 Admin"></a></footer>
<div class="modal" id="pModal"><div class="card" id="pBody"></div></div>


</div>
<div id="adminRoot" class="hidden">

<div id="gate" style="max-width:420px;margin:60px auto;padding:16px">
  <div class="card center">
    <h2 style="color:var(--gold)" data-t="🔒 JPL एडमिन|🔒 JPL Admin"></h2>
    <p style="color:var(--mut)" data-t="केवल टूर्नामेंट एडमिन के लिए। Google से लॉगिन करें।|Restricted to the Tournament Admin. Sign in with Google."></p>
    <button class="pri" id="gBtn" data-t="🔵 Google से लॉगिन|🔵 Sign in with Google"></button>
    <div class="hdrBtns"><button class="langBtn"></button></div>
    <div id="agMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
<header style="padding:8px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
  <div><h1 style="font-size:19px">🏏 JPL Admin</h1><small id="who" style="color:var(--mut)"></small></div>
  <div><button class="langBtn"></button> <a class="hbtn" href="#" style="text-decoration:none" data-t="🏠 वेबसाइट|🏠 Website"></a> <button class="hbtn" id="logout" data-t="लॉगआउट|Logout"></button></div>
</header>
<nav>
  <button class="langBtn"></button>
  <button class="on" data-tab="tPlayers" data-t="खिलाड़ी|Players"></button>
  <button data-tab="tAuction" data-t="ऑक्शन|Auction"></button>
  <button data-tab="tScore" data-t="स्कोरिंग|Scoring"></button>
  <button data-tab="tMatches" data-t="मैच/शेड्यूल|Matches"></button>
  <button data-tab="tTeams" data-t="टीमें|Teams"></button>
  <button data-tab="tMedia" data-t="मीडिया/स्पॉन्सर|Media & Sponsors"></button>

<main>

<!-- PLAYERS -->

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pidOf = id => "JPL-" + String(id).slice(0, 5).toUpperCase();

const oversOf = l => `${Math.floor(l / 6)}.${l % 6}`;
const loadImg = src => new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function keepSel(id, html) { const el = $(id); if (!el) return; const v = el.value; el.innerHTML = html; if (v && [...el.options].some(o => o.value === v)) el.value = v; }
function compress(file, max, q, type = "image/jpeg") {
  return new Promise((res, rej) => {
    const img = new Image(), r = new FileReader();
    r.onload = () => { img.src = r.result; };
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
      const x = c.getContext("2d");
      if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL(type, q));
    };
    img.onerror = rej; r.onerror = rej; r.readAsDataURL(file);

  keepSel("scMatch", open.map(m => `<option value="${m.id}">${esc(teamLabel(m, "a"))} vs ${esc(teamLabel(m, "b"))} (${stageLabel(m.stage)})${m.status === "live" ? " 🔴" : ""}</option>`).join(""));
  const m = open.find(x => x.id === $("scMatch").value);
  if (!m) { $("scInfo").innerHTML = `<div class="msg">${tr("कोई खुला मैच नहीं। खत्म हो चुके मैच यहाँ नहीं दिखते।", "No open match. Finished matches are hidden here.")}</div>`; ["scBat", "scBatter", "scBowler", "scFielder"].forEach(i => $(i).innerHTML = ""); return; }
  const li = liveInfo(m), bat = batFor(m, li.cur), bow = bat === m.aTeamId ? m.bTeamId : m.aTeamId;
  $("scInn").value = String(li.cur); $("scInn").disabled = true;
  $("scBat").innerHTML = `<option value="${bat}">${esc(teamName(bat))}</option>`; $("scBat").value = bat; $("scBat").disabled = true;
  const outs = new Set(S.balls.filter(b => b.matchId === m.id && (b.inn || 1) === li.cur && b.wicket).map(b => b.batterId));
  keepSel("scBatter", optsOf(poolFor(m, bat).filter(id => !outs.has(id))));
  keepSel("scBowler", optsOf(poolFor(m, bow)));
  keepSel("scFielder", `<option value="">—</option>` + optsOf(poolFor(m, bow)));
  const cur = li.i, balls = S.balls.filter(b => b.matchId === m.id && (b.inn || 1) === li.cur).sort((a, b) => (a.t || 0) - (b.t || 0));
  const warn = !m.firstBatId ? tr("⚠️ पहले 🪙 टॉस करें (शेड्यूल लिस्ट में)", "⚠️ Do the toss first (in Schedule list)") : !xiOK(m) ? tr("⚠️ दोनों टीमों की प्लेइंग XI चुनें (👥)", "⚠️ Select playing XI for both teams (👥)") : "";
  const crr = cur && cur.legal ? (cur.runs / (cur.legal / 6)).toFixed(2) : "0.00";
  $("scInfo").innerHTML = (warn ? `<div class="msg" style="color:var(--bad)">${warn}</div>` : "")
    + `<div class="msg"><b>${esc(teamName(bat))}</b> <span class="score">${cur ? cur.runs : 0}/${cur ? cur.wkts : 0}</span> (${oversOf(cur ? cur.legal : 0)}/${Math.floor(li.maxBalls / 6)} ${tr("ओवर", "ov")}) • CRR ${crr}`
    + (li.cur === 2 && li.target ? ` • ${tr("लक्ष्य", "Target")} <b>${li.target}</b> • ${tr("चाहिए", "Need")} ${Math.max(li.need, 0)} / ${li.left} • RRR ${li.rrr != null ? li.rrr.toFixed(2) : "—"}` : "") + `</div>`
    + (li.c1 && !cur ? `<div class="msg" style="color:var(--gold)">🔁 ${tr("पहली पारी पूरी! दूसरी पारी का पहला बॉल डालें", "1st innings over! Bowl the first ball of 2nd innings")}</div>` : "")
    + `<div style="margin-top:6px">${chipsHTML(balls.slice(-12))}</div>`
    + balls.slice(-5).reverse().map(b => `<div class="msg">${esc(commentary(b))}</div>`).join("");

// ---- ऑटो सिस्टम: समय आने पर LIVE, स्कोर न आने पर ऑटो ड्रॉ, पारी/मैच पूरा होने पर रिज़ल्ट ----
let syncBusy = false;
async function autoSync() {
  if (syncBusy || !started) return; syncBusy = true;
  try {
    const now = Date.now(), dm = (+S.settings.drawMinutes > 0 ? +S.settings.drawMinutes : 60) * 60000, b = writeBatch(db); let n = 0;
    S.matches.forEach(m => {
      if (m.status === "upcoming") {
        const due = !!m.whenISO && new Date(m.whenISO).getTime() <= now;
        if (due && xiOK(m)) { b.update(doc(db, "matches", m.id), { status: "live", liveAt: now }); n++; }
      } else if (m.status === "live") {
        const li = liveInfo(m);
        if (li.done) { const r = computeResult(m); if (r) { b.update(doc(db, "matches", m.id), { status: "done", winnerId: r.winnerId, res: r.res, result: "", endedAt: now }); n++; } return; }
        const last = S.balls.reduce((mx, x) => x.matchId === m.id ? Math.max(mx, x.t || 0) : mx, 0) || m.liveAt || 0;
        if (last && now - last > dm) { b.update(doc(db, "matches", m.id), { status: "draw", winnerId: "", res: { type: "draw", reason: "auto" }, result: "", endedAt: now }); n++; }
      }
    });
    if (n) await b.commit();
  } catch (e) { console.warn("autoSync", e.message); }
  finally { syncBusy = false; }
}
setInterval(() => { autoSync(); }, 20000);

function roundRobin(ids) { const a = [...ids]; if (a.length % 2) a.push(null); const n = a.length, out = []; for (let r = 0; r < n - 1; r++) { for (let i = 0; i < n / 2; i++) { const x = a[i], y = a[n - 1 - i]; if (x && y) out.push([x, y]); } a.splice(1, 0, a.pop()); } return out; }
$("genBtn").onclick = () => {
  const ids = [...document.querySelectorAll(".gt:checked")].map(c => c.value); if (ids.length < 2) { alert(tr("कम से कम 2 टीमें चुनें", "Select at least 2 teams")); return; }
  const fx = roundRobin(ids).map(([a, b]) => ({ stage: "league", aTeamId: a, bTeamId: b, aLabel: "", bLabel: "" }));
  if ($("genSemi").checked) { if (ids.length >= 4) fx.push({ stage: "semi", aTeamId: "", bTeamId: "", aLabel: "#1", bLabel: "#4" }, { stage: "semi", aTeamId: "", bTeamId: "", aLabel: "#2", bLabel: "#3" }, { stage: "final", aTeamId: "", bTeamId: "", aLabel: "W-SF1", bLabel: "W-SF2" }); else fx.push({ stage: "final", aTeamId: "", bTeamId: "", aLabel: "#1", bLabel: "#2" }); }
  const start = $("genStart").value ? new Date($("genStart").value) : null, gap = (+$("genGap").value || 2) * 3600000;
  genPlan = fx.map((f, i) => ({ ...f, whenISO: start ? toLocal(new Date(start.getTime() + i * gap)) : "", groundId: $("genGround").value, overs: +$("genOvers").value || cfg().overs }));
  $("genPreview").innerHTML = `<div class="tw"><table><tr><th>#</th><th>${tr("स्टेज", "Stage")}</th><th>${tr("मैच", "Match")}</th><th>${tr("तारीख/समय", "Date/Time")}</th><th>${tr("ग्राउंड", "Ground")}</th></tr>${genPlan.map((f, i) => `<tr><td>${i + 1}</td><td>${stageLabel(f.stage)}</td><td>${esc(f.aTeamId ? teamName(f.aTeamId) : f.aLabel)} vs ${esc(f.bTeamId ? teamName(f.bTeamId) : f.bLabel)}</td><td><input type="datetime-local" data-gi="${i}" data-gf="w" value="${f.whenISO}"></td><td><select data-gi="${i}" data-gf="g">${groundOpts(f.groundId)}</select></td></tr>`).join("")}</table></div><button class="pri" id="genSave">${tr("शेड्यूल सेव करें", "Save Schedule")} (${genPlan.length})</button>`;
  $("genSave").onclick = saveSchedule; applyLang();
};
$("genPreview").addEventListener("change", e => { const i = e.target.dataset.gi; if (i == null) return; if (e.target.dataset.gf === "w") genPlan[i].whenISO = e.target.value; else genPlan[i].groundId = e.target.value; });
async function saveSchedule() {
  const b = writeBatch(db), base = Date.now();
  genPlan.forEach((f, i) => { const a = teamOf(f.aTeamId), t = teamOf(f.bTeamId), g = S.grounds.find(x => x.id === f.groundId);
    b.set(doc(collection(db, "matches")), { ...f, aName: a?.name || "", bName: t?.name || "", groundName: g?.name || "", status: "upcoming", result: "", seq: base + i, t: base + i, createdAt: serverTimestamp() }); });
  await b.commit(); genPlan = []; $("genPreview").innerHTML = `<div class="msg">✅ ${tr("शेड्यूल सेव हो गया", "Schedule saved")}</div>`;
}

  keepSel("tmCoach", `<option value="">—</option>` + S.coaches.map(c => `<option>${esc(c.name)}</option>`).join(""));
  if (!$("tmPurse").value) $("tmPurse").placeholder = cfg().purse;
  $("tmList").innerHTML = S.teams.map(t => `<div class="msg" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${logo(t, 44)}<div style="flex:1"><b>${esc(t.name)}</b><br><small>${tr("कप्तान", "Captain")}: ${esc(t.captain || "—")} • ${tr("कोच", "Coach")}: ${esc(t.coach || "—")} • ${tr("मालिक", "Owner")}: ${esc(t.ownerName || "—")} ${esc(t.ownerEmail || "")} • ${tr("पर्स", "Purse")}: ${rupee(t.purse)}</small></div>
    <button class="sm" data-purse="${t.id}">${tr("पर्स", "Purse")}</button><button class="sm" data-del="${t.id}">🗑</button></div>`).join("") || "—";
}
$("tmAdd").onclick = async () => {
  const name = $("tmName").value.trim(); if (!name) return; const f = $("tmLogo").files[0], lg = f ? await compress(f, 300, .9, "image/png") : "", email = $("tmOwner").value.trim().toLowerCase();
  const r = await addDoc(collection(db, "teams"), { name, captain: $("tmCap").value.trim(), coach: $("tmCoach").value, ownerName: $("tmOwnerName").value.trim(), ownerEmail: email, logo: lg, purse: +$("tmPurse").value || cfg().purse, createdAt: serverTimestamp(), t: Date.now() });
  if (email) await setDoc(doc(db, "owners", email), { teamId: r.id }); ["tmName", "tmCap", "tmOwnerName", "tmOwner", "tmPurse", "tmLogo"].forEach(i => $(i).value = "");
};
$("tmList").onclick = async e => { const p = e.target.closest("[data-purse]")?.dataset.purse, d = e.target.closest("[data-del]")?.dataset.del;
  if (p) { const v = prompt(tr("नया पर्स (₹)", "New purse (₹)")); if (v !== null && v !== "" && !isNaN(+v)) await updateDoc(doc(db, "teams", p), { purse: +v }); }
  if (d) { const t = teamOf(d); if (confirm(tr("टीम हटाएं?", "Delete team?"))) { await deleteDoc(doc(db, "teams", d)); if (t?.ownerEmail) await deleteDoc(doc(db, "owners", t.ownerEmail)); } } };

// ================= MEDIA =================
function renderMedia() {
  if (document.activeElement && ["spName", "nwText", "pQ", "pOpts"].includes(document.activeElement.id)) return;
  $("spList").innerHTML = S.sponsors.map(s => `<div class="msg"><img src="${s.logo}" style="height:36px;vertical-align:middle;background:#fff;border-radius:4px"> ${esc(s.name)} <span class="tag role">${s.tier === "title" ? tr("टाइटल", "Title") : tr("को-स्पॉन्सर", "Co-sponsor")}</span> <button class="sm" data-d="sponsors|${s.id}">🗑</button></div>`).join("");
  $("nwList").innerHTML = S.news.map(n => `<div class="msg">${esc(n.text)} <button class="sm" data-d="news|${n.id}">🗑</button></div>`).join("");
  $("pList").innerHTML = S.polls.map(p => `<div class="msg">${esc(p.qHi || p.question || "")} ${p.open === false ? '<span class="tag rej">CLOSED</span>' : ""} <button class="sm" data-tg="${p.id}">${p.open === false ? tr("खोलें", "Open") : tr("बंद", "Close")}</button><button class="sm" data-d="polls|${p.id}">🗑</button></div>`).join("");
  const pend = S.media.filter(m => m.status === "pending"), ok = S.media.filter(m => m.status !== "pending" && m.status !== "rejected");
  const card = (m, pending) => `<div class="msg">${m.kind === "video" ? `<a href="${esc(m.url)}" target="_blank">🎬 ${esc(m.url)}</a>` : `<img class="th" src="${m.src}">`} ${esc(m.caption)} ${pending ? `<button class="sm ok" data-ap="${m.id}">${tr("Approve", "Approve")}</button><button class="sm bad" data-d="media|${m.id}">${tr("Reject", "Reject")}</button>` : `<button class="sm" data-d="media|${m.id}">🗑</button>`}</div>`;
  $("gPending").innerHTML = pend.map(m => card(m, true)).join("") || "—"; $("gApproved").innerHTML = ok.map(m => card(m, false)).join("") || "—";
}
$("tMedia").onclick = async e => { const d = e.target.closest("[data-d]")?.dataset.d, ap = e.target.closest("[data-ap]")?.dataset.ap, tg = e.target.closest("[data-tg]")?.dataset.tg;
  if (d) { const [c, id] = d.split("|"); await delDoc(c, id); } if (ap) await updateDoc(doc(db, "media", ap), { status: "approved" });
  if (tg) await updateDoc(doc(db, "polls", tg), { open: S.polls.find(p => p.id === tg).open === false }); };
$("spAdd").onclick = async () => { const f = $("spLogo").files[0], n = $("spName").value.trim(); if (!f || !n) { alert(tr("नाम और लोगो चुनें", "Enter name and logo")); return; }
  await addDoc(collection(db, "sponsors"), { name: n, tier: $("spTier").value, logo: await compress(f, 400, .9, "image/png"), createdAt: serverTimestamp(), t: Date.now() }); $("spName").value = ""; $("spLogo").value = ""; };
$("nwAdd").onclick = async () => { const t = $("nwText").value.trim(); if (t) { await addDoc(collection(db, "news"), { text: t, createdAt: serverTimestamp(), t: Date.now() }); $("nwText").value = ""; } };
$("pAdd").onclick = async () => { const l = $("pOpts").value.split(",").map(s => s.trim()).filter(Boolean), q = $("pQ").value.trim(); if (!q || l.length < 2) { alert(tr("सवाल व कम से कम 2 विकल्प", "Question and at least 2 options")); return; }
  await addDoc(collection(db, "polls"), { question: q, labels: l, counts: {}, open: true, createdAt: serverTimestamp(), t: Date.now() }); $("pQ").value = ""; $("pOpts").value = ""; };

// ================= SETTINGS =================
function renderSettings() {
  const c = cfg(), s = S.settings, set = (id, v) => { if (document.activeElement !== $(id)) $(id).value = v ?? ""; };
  set("setEntry", s.entryFee || ""); set("setUpi", s.upiId); set("setUpiName", s.upiName); set("setWa", s.adminWa || c.adminWa); set("setDate", s.startDate); set("setPurse", s.purse || ""); set("setBase", s.basePrice || ""); set("setSquad", s.squadSize || ""); set("setOvers", s.overs || ""); set("setWk", s.wicketsLimit || "");
  $("gList").innerHTML = S.grounds.map(g => `<div class="msg">${esc(g.name)} – ${esc(g.addr || "")} <button class="sm" data-d="grounds|${g.id}">🗑</button></div>`).join("");
  $("cList").innerHTML = S.coaches.map(x => `<div class="msg">${esc(x.name)} ${esc(x.phone || "")} <button class="sm" data-d="coaches|${x.id}">🗑</button></div>`).join("");
}
$("tSettings").onclick = e => { const d = e.target.closest("[data-d]")?.dataset.d; if (d) { const [c, id] = d.split("|"); delDoc(c, id); } };
$("setSave").onclick = async () => {
  const d = { entryFee: +$("setEntry").value || 0, upiId: $("setUpi").value.trim(), upiName: $("setUpiName").value.trim(), adminWa: $("setWa").value.trim(), startDate: $("setDate").value, purse: +$("setPurse").value || 0, basePrice: +$("setBase").value || 0, squadSize: +$("setSquad").value || 0, overs: +$("setOvers").value || 0, wicketsLimit: +$("setWk").value || 0 };
  if ($("setQr").files[0]) d.qrImg = await compress($("setQr").files[0], 500, .9, "image/png");
  await setDoc(doc(db, "settings", "main"), d, { merge: true }); $("setMsg").innerHTML = `<div class="msg">✅ ${tr("सेव हो गया", "Saved")}</div>`; };
$("gAdd").onclick = async () => { if ($("gName").value.trim()) { await addDoc(collection(db, "grounds"), { name: $("gName").value.trim(), addr: $("gAddr").value.trim() }); $("gName").value = ""; $("gAddr").value = ""; } };
$("gDefault").onclick = async () => { for (const [n, a] of [["Porsa Ground", "Porsa"], ["Jotai Ground", "Jotai"]]) if (!S.grounds.some(g => g.name === n)) await addDoc(collection(db, "grounds"), { name: n, addr: a }); };
$("cAdd").onclick = async () => { if ($("cName").value.trim()) { await addDoc(collection(db, "coaches"), { name: $("cName").value.trim(), phone: $("cPhone").value.trim() }); $("cName").value = ""; $("cPhone").value = ""; } };
$("cSubodh").onclick = async () => { if (!S.coaches.some(c => c.name === "सुबोध")) await addDoc(collection(db, "coaches"), { name: "सुबोध", phone: "" }); };

// ================= SCANNER =================
let stream = null, timer = null;
const stopScan = () => { clearInterval(timer); stream?.getTracks().forEach(t => t.stop()); stream = null; };
$("scanStop").onclick = stopScan;
$("scanStart").onclick = async () => {
  if (!("BarcodeDetector" in window)) { $("scanRes").innerHTML = `<div class="msg">${tr("इस ब्राउज़र में QR स्कैनर नहीं – ऊपर ID डालकर चेक करें", "QR scanning unsupported here – type the ID above")}</div>`; return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); const v = $("scanVid"); v.srcObject = stream; await v.play(); const det = new BarcodeDetector({ formats: ["qr_code"] });
    timer = setInterval(async () => { const c = await det.detect(v); if (c.length) { const r = c[0].rawValue; stopScan(); show(r.includes("p=") ? r.split("p=")[1].split("&")[0] : r); } }, 500);
  } catch (e) { $("scanRes").innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
};
$("scanManual").onclick = () => { const raw = $("scanId").value.trim(), p = S.players.find(x => pidOf(x.id) === raw.toUpperCase()) || S.players.find(x => x.id === raw); show(p ? p.id : raw); };
function show(id) { const p = S.players.find(x => x.id === id), pr = S.priv[id] || {};
  $("scanRes").innerHTML = p ? `<div class="msg"><img class="th" src="${p.photo}"> <b>${esc(p.name)}</b> • ${roleLabel(p.role)} • ${esc(p.village || "")} • ${esc(p.teamName || "—")}<br>${pidOf(p.id)} • ${esc(pr.mobile || "")}<br>${ps(p) === "paid" ? `<span class="tag paid">✅ ${tr("पेमेंट अप्रूव्ड – अंदर आने दें", "Payment approved – allow entry")}</span>` : ps(p) === "rejected" ? `<span class="tag rej">❌ ${tr("रिजेक्टेड", "Rejected")}</span>` : `<span class="tag pend">⏳ ${tr("पेंडिंग – पहले वेरिफाई करें", "Pending – verify first")}</span>`}</div>` : `<div class="msg">❌ ${tr("खिलाड़ी नहीं मिला", "Player not found")}</div>`; }
applyLang();

}

onAuthStateChanged(auth, u => { window.__pubAuth && window.__pubAuth(u); if (location.hash === "#admin") window.__adminAuth && window.__adminAuth(u); });
function route() {
  const adm = location.hash === "#admin";
  $("pubRoot").classList.toggle("hidden", adm); $("adminRoot").classList.toggle("hidden", !adm);
  window.scrollTo(0, 0); if (adm && window.__adminAuth) window.__adminAuth(auth.currentUser);
}
window.addEventListener("hashchange", route); route();

</script>
</body>
</html>
